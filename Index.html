<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>Space Explorer</title>
<link rel="canonical" href="https://sahriarsaif.com/projects/space-explorer.html" />
<meta property="og:url" content="https://sahriarsaif.com/projects/space-explorer.html" />
<meta name="description" content="Explore the galaxy, black holes, and solar system in an interactive 3D space experience. Discover planets, customize cosmic colors, and explore the universe with Space Explorer by Sahriar Saif." />
<style>
  :root {
    --bg: #000005;
    --glass: rgba(12, 14, 28, 0.55);
    --line: rgba(255, 255, 255, 0.14);
    --accent: #6ee7ff;
    --text: #eaf6ff;
    --muted: #7fb8d9;
    --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); }
  canvas { display: block; }
  button { font-family: inherit; }

  #loading {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted); font-size: 13px; letter-spacing: 4px;
  }

  /* NAV */
  #navBar {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    z-index: 15; display: flex; gap: 4px; padding: 4px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    max-width: calc(100vw - 16px);
  }
  .nav-btn {
    background: transparent; border: 0; color: #9fd3e8; font-size: 12px; letter-spacing: .4px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: background .25s, color .25s, box-shadow .25s;
  }
  .nav-btn:hover { color: #fff; }
  .nav-btn.active { background: rgba(110, 231, 255, .2); color: #fff; box-shadow: 0 0 14px rgba(110, 231, 255, .35) inset; }

  /* TITLE */
  #overlay {
    position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 10; padding: 0 12px;
  }
  #overlay h1 {
    margin: 10px 0 4px; font-size: 22px; font-weight: 700; letter-spacing: .6px;
    background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(80, 200, 255, .45));
  }
  #overlay p { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: 1.4px; text-transform: uppercase; }

  #shapeLabel {
    position: fixed; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center;
    color: var(--accent); font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    opacity: .9; z-index: 10; pointer-events: none; text-shadow: 0 0 12px rgba(100, 220, 255, .7);
  }

  /* PANELS */
  .panel {
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35); color: #fff; user-select: none;
  }
  #colorPanel { position: fixed; top: calc(128px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 10; padding: 12px 14px; }
  .cp-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .cp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
  .cp-row label { font-size: 12px; opacity: .9; }
  .cp-row input[type="color"] {
    width: 36px; height: 22px; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer; padding: 0;
  }
  .cp-presets { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 9px; margin-top: 3px; border-top: 1px solid var(--line); }
  .cp-swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .4); cursor: pointer; padding: 0;
    transition: transform .15s;
  }
  .cp-swatch:hover { transform: scale(1.15); }
  .cp-swatch:active { transform: scale(.9); }

  #planetMenu {
    position: fixed; top: calc(128px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 10;
    padding: 6px; max-height: 52vh; overflow-y: auto; scrollbar-width: thin;
  }
  .planet-btn {
    display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 0; color: #cfeaf5;
    font-size: 12px; padding: 7px 10px; border-radius: 10px; cursor: pointer; text-align: left;
    transition: background .2s, color .2s;
  }
  .planet-btn:hover { background: rgba(255, 255, 255, .07); }
  .planet-btn.active { background: rgba(110, 231, 255, .2); color: #fff; }
  .planet-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 7px currentColor; }

  #planetInfo {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    width: min(520px, calc(100vw - 24px)); z-index: 10; padding: 14px 18px; color: var(--text); display: none; user-select: text;
  }
  #planetInfo h2 { margin: 0 0 2px; font-size: 17px; }
  #planetInfo .au { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 7px; }
  #planetInfo p { margin: 0; font-size: 13px; line-height: 1.5; color: #d8ecf5; }

  #credit {
    position: fixed; right: 12px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 9;
    font-size: 10px; letter-spacing: 1px; color: rgba(159, 211, 232, .55); text-decoration: none; transition: color .2s;
  }
  #credit:hover { color: #fff; }

  @media (max-width: 520px) {
    #overlay h1 { font-size: 19px; }
    .nav-btn { padding: 8px 11px; font-size: 11px; }
    #planetMenu { max-height: 40vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<div id="loading">LOADING…</div>

<div id="navBar" role="tablist">

  <button class="nav-btn" data-mode="blackhole">Black Hole</button>

</div>

<div id="overlay">

</div>

<div id="colorPanel" class="panel">

  <div class="cp-row"><label for="cpCore">Core</label><input type="color" id="cpCore" value="#ffffff" /></div>
  <div class="cp-row"><label for="cpMid">Glow</label><input type="color" id="cpMid" value="#6ee7ff" /></div>

    <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ff6ec7,#7a0e6e)" data-core="#ffffff" data-mid="#ff6ec7" data-edge="#7a0e6e" aria-label="Pink"></button>
    <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#b388ff,#3a0ca3)" data-core="#ffffff" data-mid="#b388ff" data-edge="#3a0ca3" aria-label="Purple"></button>
    <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ffd166,#a85200)" data-core="#ffffff" data-mid="#ffd166" data-edge="#a85200" aria-label="Gold"></button>
    <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#6effa3,#0a6e3a)" data-core="#ffffff" data-mid="#6effa3" data-edge="#0a6e3a" aria-label="Green"></button>
    <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ff6e6e,#7a0e0e)" data-core="#ffffff" data-mid="#ff6e6e" data-edge="#7a0e0e" aria-label="Red"></button>
  </div>
</div>

<div id="planetMenu" class="panel"></div>
<div id="planetInfo" class="panel">
  <h2 id="piName">—</h2>
  <div class="au" id="piAu">—</div>
  <p id="piFact">—</p>
</div>

{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- runtime config ---------- */
const _k = [23, 91, 202, 7, 141];
const _d = s => { try { return Array.from(atob(s), (c, i) => String.fromCharCode(c.charCodeAt(0) ^ _k[i % _k.length])).join(''); } catch (e) { return ''; } };
const _cfg = { a: 'RDqideR2KepU7H49', b: 'fy++d/4tdOV07H8po2b/ZDqjYaN0NKc=' };

/* ---------- scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 3.2, 9);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setClearColor(0x000001);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.4, 0.35);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0x223355, 1.1));
const sunLight = new THREE.PointLight(0xfff2cc, 3.2, 60, 1.6);
scene.add(sunLight);

/* ---------- sprites ---------- */
function makeSprite(stops) {
  const size = 64, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, a]) => g.addColorStop(o, `rgba(255,255,255,${a})`));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const sprite = makeSprite([[0, 0.85], [0.35, 0.35], [1, 0]]);
const dotSprite = makeSprite([[0, 1], [0.5, 0.65], [1, 0]]);

/* ---------- background stars ---------- */
function sphereCloud(count, rMin, rRange) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = rMin + Math.random() * rRange;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return geo;
}
function addPoints(geo, size, color, opacity) {
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: sprite, transparent: true, depthWrite: false, color, opacity,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
  scene.add(pts);
  return pts;
}
addPoints(sphereCloud(9000, 50, 150), 0.028, 0xbfe0f2, 0.75);
addPoints(sphereCloud(500, 45, 140), 0.09, 0xffffff, 0.9);
addPoints(sphereCloud(40, 9, 26), 0.55, 0x9fe0ff, 0.3);
const galaxyBokehPoints = addPoints(sphereCloud(220, 6, 34), 1.6, 0x9fe0ff, 0.4);

/* ---------- galaxy mode ---------- */
const GALAXY_COUNT = 40000;
let colorCore = new THREE.Color(0xffffff);
let colorMid = new THREE.Color(0x6ee7ff);
let colorEdge = new THREE.Color(0x1450a8);
const _tmpA = new THREE.Color(), _tmpB = new THREE.Color();

function colorForT(t, out) {
  if (t < 0.5) return out.copy(colorCore).lerp(colorMid, t * 2);
  return out.copy(colorMid).lerp(colorEdge, (t - 0.5) * 2);
}
function paint(colors, tVals, i, t) {
  colorForT(t, _tmpA);
  colors[i * 3] = _tmpA.r; colors[i * 3 + 1] = _tmpA.g; colors[i * 3 + 2] = _tmpA.b;
  tVals[i] = t;
}

function buildGalaxy(n) {
  const positions = new Float32Array(n * 3), colors = new Float32Array(n * 3), tVals = new Float32Array(n);
  const branches = 4, radius = 5.2, spin = 1.6, randomness = 0.32, power = 2.6;
  const rand = () => Math.pow(Math.random(), power) * (Math.random() < 0.5 ? 1 : -1);
  for (let i = 0; i < n; i++) {
    const r = Math.pow(Math.random(), 0.7) * radius;
    const angle = ((i % branches) / branches) * Math.PI * 2 + r * spin;
    positions[i * 3] = Math.cos(angle) * r + rand() * randomness * r;
    positions[i * 3 + 1] = rand() * randomness * r * 0.25;
    positions[i * 3 + 2] = Math.sin(angle) * r + rand() * randomness * r;
    paint(colors, tVals, i, r / radius);
  }
  return { positions, colors, tVals };
}

function buildOrbJets(n) {
  const positions = new Float32Array(n * 3), colors = new Float32Array(n * 3), tVals = new Float32Array(n);
  const sphereCount = n - Math.floor(n * 0.35);
  for (let i = 0; i < n; i++) {
    let x, y, z, t;
    if (i < sphereCount) {
      const rad = 0.6 + Math.random() * 0.7;
      const theta = 2 * Math.PI * Math.random(), phi = Math.acos(2 * Math.random() - 1);
      x = rad * Math.sin(phi) * Math.cos(theta);
      y = rad * Math.sin(phi) * Math.sin(theta) * 0.4;
      z = rad * Math.cos(phi);
      t = rad / 1.3;
    } else {
      const side = i % 2 === 0 ? 1 : -1;
      const along = Math.pow(Math.random(), 1.8) * 4.6;
      const w = 0.04 + along * 0.05;
      x = w * (Math.random() - 0.5) * 2;
      y = side * (0.6 + along);
      z = w * (Math.random() - 0.5) * 2;
      t = Math.min(along / 4.6, 1);
    }
    positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
    paint(colors, tVals, i, t);
  }
  return { positions, colors, tVals };
}

function buildTorusKnot(n) {
  const positions = new Float32Array(n * 3), colors = new Float32Array(n * 3), tVals = new Float32Array(n);
  const p = 2, q = 3, R = 3.4, r = 1.1, tube = 0.22;
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2;
    const k = R + r * Math.cos(q * u);
    positions[i * 3] = k * Math.cos(p * u) + (Math.random() - 0.5) * tube;
    positions[i * 3 + 1] = r * Math.sin(q * u) + (Math.random() - 0.5) * tube;
    positions[i * 3 + 2] = k * Math.sin(p * u) + (Math.random() - 0.5) * tube;
    paint(colors, tVals, i, Math.sin(q * u) * 0.5 + 0.5);
  }
  return { positions, colors, tVals };
}

const GALAXY_SHAPES = [
  { name: 'Spiral Galaxy', data: buildGalaxy(GALAXY_COUNT) },
  { name: 'Collapsing Star', data: buildOrbJets(GALAXY_COUNT) },
  { name: 'Torus Knot', data: buildTorusKnot(GALAXY_COUNT) },
];

const galaxyGeometry = new THREE.BufferGeometry();
const galaxyLivePositions = new Float32Array(GALAXY_SHAPES[0].data.positions);
const galaxyLiveColors = new Float32Array(GALAXY_SHAPES[0].data.colors);
galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyLivePositions, 3));
galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyLiveColors, 3));
const galaxyPoints = new THREE.Points(galaxyGeometry, new THREE.PointsMaterial({
  size: 0.022, map: dotSprite, vertexColors: true, transparent: true, opacity: 0.9,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
}));
scene.add(galaxyPoints);

let galCurrent = 0, galNext = 1, galMorphing = false, galMorphT = 0;
const GAL_MORPH_DURATION = 2.2, GAL_HOLD_DURATION = 3.2;
let galHoldTimer = GAL_HOLD_DURATION;
const shapeLabel = document.getElementById('shapeLabel');

const easeInOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

function startGalaxyMorph() {
  galMorphing = true;
  galMorphT = 0;
  galNext = (galCurrent + 1) % GALAXY_SHAPES.length;
  shapeLabel.textContent = GALAXY_SHAPES[galNext].name;
}

function blendGalaxy(e, withPositions) {
  const from = GALAXY_SHAPES[galCurrent].data, to = GALAXY_SHAPES[galNext].data;
  const n = GALAXY_COUNT * 3;
  if (withPositions) for (let i = 0; i < n; i++) galaxyLivePositions[i] = from.positions[i] + (to.positions[i] - from.positions[i]) * e;
  for (let i = 0; i < n; i++) galaxyLiveColors[i] = from.colors[i] + (to.colors[i] - from.colors[i]) * e;
}

function regenerateGalaxyColors() {
  for (const shape of GALAXY_SHAPES) {
    const { colors, tVals } = shape.data;
    for (let i = 0; i < GALAXY_COUNT; i++) paint(colors, tVals, i, tVals[i]);
  }
  if (galMorphing) blendGalaxy(easeInOutCubic(Math.min(galMorphT, 1)), false);
  else galaxyLiveColors.set(GALAXY_SHAPES[galCurrent].data.colors);
  galaxyGeometry.attributes.color.needsUpdate = true;
}

function updateGalaxy(dt) {
  if (galMorphing) {
    galMorphT += dt / GAL_MORPH_DURATION;
    blendGalaxy(easeInOutCubic(Math.min(galMorphT, 1)), true);
    galaxyGeometry.attributes.position.needsUpdate = true;
    galaxyGeometry.attributes.color.needsUpdate = true;
    if (galMorphT >= 1) { galMorphing = false; galCurrent = galNext; galHoldTimer = GAL_HOLD_DURATION; }
  } else {
    galHoldTimer -= dt;
    if (galHoldTimer <= 0) startGalaxyMorph();
  }
  galaxyPoints.rotation.y += dt * 0.05;
}

/* ---------- black hole mode ---------- */
const blackholeGroup = new THREE.Group();
blackholeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));

const DISK_COUNT = 16000;
const diskRadius = new Float32Array(DISK_COUNT), diskAngle0 = new Float32Array(DISK_COUNT);
const diskSpeed = new Float32Array(DISK_COUNT), diskHeight = new Float32Array(DISK_COUNT);
const diskColors = new Float32Array(DISK_COUNT * 3), diskPositions = new Float32Array(DISK_COUNT * 3);
const diskInner = new THREE.Color(0xfff8e0), diskMid = new THREE.Color(0xff8a2e), diskOuter = new THREE.Color(0x8a1010);
const CORE_COUNT = Math.floor(DISK_COUNT * 0.4), ARM_BRANCHES = 2, ARM_SPIN = 2.4;

for (let i = 0; i < DISK_COUNT; i++) {
  let rr, angle0, height, t;
  if (i < CORE_COUNT) {
    rr = 0.28 + Math.pow(Math.random(), 1.6) * 1.6;
    angle0 = Math.random() * Math.PI * 2;
    height = (Math.random() - 0.5) * 0.1;
    t = rr / 1.9;
  } else {
    rr = 1.5 + Math.pow(Math.random(), 0.75) * 7.5;
    const branchAngle = ((i % ARM_BRANCHES) / ARM_BRANCHES) * Math.PI * 2;
    const scatter = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 0.55;
    angle0 = branchAngle + rr * ARM_SPIN * 0.18 + scatter;
    height = (Math.random() - 0.5) * (0.04 + rr * 0.05);
    t = Math.min((rr - 1.5) / 7.5, 1);
  }
  diskRadius[i] = rr; diskAngle0[i] = angle0; diskSpeed[i] = 1.3 / Math.sqrt(rr); diskHeight[i] = height;
  const col = t < 0.5 ? _tmpA.copy(diskInner).lerp(diskMid, t * 2) : _tmpA.copy(diskMid).lerp(diskOuter, (t - 0.5) * 2);
  diskColors[i * 3] = col.r; diskColors[i * 3 + 1] = col.g; diskColors[i * 3 + 2] = col.b;
}
const diskGeometry = new THREE.BufferGeometry();
diskGeometry.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
diskGeometry.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));
const diskPoints = new THREE.Points(diskGeometry, new THREE.PointsMaterial({
  size: 0.045, map: sprite, vertexColors: true, transparent: true, opacity: 0.9,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
}));
diskPoints.rotation.x = Math.PI / 2.6;
blackholeGroup.add(diskPoints);

let diskTime = 0;
function updateBlackhole(dt) {
  diskTime += dt;
  for (let i = 0; i < DISK_COUNT; i++) {
    const a = diskAngle0[i] + diskTime * diskSpeed[i], r = diskRadius[i];
    diskPositions[i * 3] = Math.cos(a) * r;
    diskPositions[i * 3 + 1] = diskHeight[i];
    diskPositions[i * 3 + 2] = Math.sin(a) * r;
  }
  diskGeometry.attributes.position.needsUpdate = true;
  blackholeGroup.rotation.y += dt * 0.01;
}

/* ---------- solar system mode ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const makeTerrestrialTexture = (base, spots, count) => canvasTex(256, 128, (ctx, w, h) => {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < count; i++) {
    const r = 3 + Math.random() * 14;
    ctx.globalAlpha = 0.18 + Math.random() * 0.35;
    ctx.fillStyle = spots[(Math.random() * spots.length) | 0];
    ctx.beginPath();
    ctx.ellipse(Math.random() * w, Math.random() * h, r, r * (0.5 + Math.random() * 0.4), Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
});
const makeBandedTexture = stops => canvasTex(256, 128, (ctx, w, h) => {
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  stops.forEach((col, i) => grad.addColorStop(i / (stops.length - 1), col));
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 55; i++) {
    const y = Math.random() * h;
    ctx.strokeStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.07})`;
    ctx.lineWidth = 1 + Math.random() * 2.5;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= w; x += 12) ctx.lineTo(x, y + Math.sin(x * 0.06 + i) * 3);
    ctx.stroke();
  }
});
const makeSunTexture = () => canvasTex(512, 256, (ctx, w, h) => {
  ctx.fillStyle = '#ffd54f'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) {
    ctx.globalAlpha = 0.2 + Math.random() * 0.35;
    ctx.fillStyle = Math.random() < 0.5 ? '#ff8c28' : '#fff6c8';
    ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
});

const planetsGroup = new THREE.Group();
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), new THREE.MeshBasicMaterial({ map: makeSunTexture() }));
planetsGroup.add(sunMesh);
sunLight.position.set(0, 0, 0);

const PLANET_DATA = [
  { name: 'Mercury', au: 0.39, size: 0.16, dotColor: '#9c9c9c', fact: 'Closest planet to the Sun and the smallest in the solar system.', tex: () => makeTerrestrialTexture('#9c9c9c', ['#7a7a7a', '#bdbdbd', '#8f8f8f'], 260) },
  { name: 'Venus', au: 0.72, size: 0.28, dotColor: '#e8cda2', fact: 'The hottest planet — a runaway greenhouse effect traps heat under thick clouds.', tex: () => makeTerrestrialTexture('#e8cda2', ['#d8b878', '#f0e0b8', '#c9a868'], 160) },
  { name: 'Earth', au: 1.0, size: 0.30, dotColor: '#2f6fed', fact: 'The only known planet with life. About 71% of its surface is water.', tex: () => makeTerrestrialTexture('#1c4fa0', ['#2f7d32', '#5a8f3c', '#e8e8e8', '#3a6bc9'], 220) },
  { name: 'Mars', au: 1.52, size: 0.20, dotColor: '#b1440e', fact: 'The Red Planet, colored by iron oxide dust. Home to Olympus Mons, the tallest volcano.', tex: () => makeTerrestrialTexture('#b1440e', ['#8a3208', '#d97a4a', '#c65a20'], 220) },
  { name: 'Jupiter', au: 5.2, size: 0.85, dotColor: '#d8ae76', fact: 'The largest planet. Its Great Red Spot is a storm bigger than Earth.', tex: () => makeBandedTexture(['#a97a4e', '#e3c9a0', '#c9a26a', '#f0dfc0', '#b98a5c', '#e3c9a0']) },
  { name: 'Saturn', au: 9.58, size: 0.72, dotColor: '#e3c98f', fact: 'Famous for its spectacular ring system made of ice and rock.', ring: true, tex: () => makeBandedTexture(['#d9c088', '#f2e6c2', '#e8d3a0', '#f2e6c2']) },
  { name: 'Uranus', au: 19.2, size: 0.48, dotColor: '#9fe3e0', fact: 'Rotates almost on its side, likely from an ancient collision.', tex: () => makeBandedTexture(['#8fd6d3', '#bdf0ee', '#9fe3e0']) },
  { name: 'Neptune', au: 30.1, size: 0.46, dotColor: '#3f5efb', fact: 'The windiest planet, with storms reaching over 2,000 km/h.', tex: () => makeBandedTexture(['#2f4ad0', '#5f7dfc', '#3f5efb']) },
  { name: 'Pluto', au: 39.5, size: 0.12, dotColor: '#b8a58c', fact: 'A dwarf planet in the Kuiper Belt, with a heart-shaped glacier region.', tex: () => makeTerrestrialTexture('#b8a58c', ['#9c8770', '#cdbba0', '#a89478'], 180) },
];

const orbitRadiusFor = au => 2.4 + Math.sqrt(au) * 2.0;
const orbitMat = new THREE.LineBasicMaterial({ color: 0x33475e, transparent: true, opacity: 0.28 });
const sphereGeo = new THREE.SphereGeometry(1, 32, 32);

const planets = PLANET_DATA.map((p, idx) => {
  const orbitR = orbitRadiusFor(p.au);
  const mesh = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ map: p.tex(), roughness: 0.85, metalness: 0.03 }));
  mesh.scale.setScalar(p.size);
  planetsGroup.add(mesh);

  if (p.ring) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.4, 2.2, 48),
      new THREE.MeshBasicMaterial({ color: 0xd8c79a, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
    );
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  const pts = new THREE.EllipseCurve(0, 0, orbitR, orbitR, 0, Math.PI * 2, false, 0)
    .getPoints(128).map(pt => new THREE.Vector3(pt.x, 0, pt.y));
  planetsGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), orbitMat));

  return { ...p, mesh, orbitR, angle: Math.random() * Math.PI * 2, speed: 0.35 / Math.sqrt(p.au), idx };
});

function updatePlanets(dt) {
  for (const p of planets) {
    p.angle += dt * p.speed;
    p.mesh.position.set(Math.cos(p.angle) * p.orbitR, 0, Math.sin(p.angle) * p.orbitR);
    p.mesh.rotation.y += dt * 0.6;
  }
  sunMesh.rotation.y += dt * 0.05;
}

/* ---------- planet menu ---------- */
const planetMenuEl = document.getElementById('planetMenu');
const planetInfoEl = document.getElementById('planetInfo');
const piName = document.getElementById('piName');
const piAu = document.getElementById('piAu');
const piFact = document.getElementById('piFact');
let selectedPlanet = null;

function menuButton(label, color, active, onClick) {
  const btn = document.createElement('button');
  btn.className = 'planet-btn' + (active ? ' active' : '');
  const dot = document.createElement('span');
  dot.className = 'planet-dot';
  dot.style.background = color;
  dot.style.color = color;
  btn.append(dot, document.createTextNode(label));
  btn.addEventListener('click', () => onClick(btn));
  planetMenuEl.appendChild(btn);
}
menuButton('Overview', '#6ee7ff', true, b => selectPlanet(null, b));
planets.forEach(p => menuButton(p.name, p.dotColor, false, b => selectPlanet(p, b)));

function selectPlanet(p, btnEl) {
  selectedPlanet = p;
  planetMenuEl.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  if (p) {
    planetInfoEl.style.display = 'block';
    piName.textContent = p.name;
    piAu.textContent = `${p.au} AU from the Sun`;
    piFact.textContent = p.fact;
    requestFocus(p.size * 6 + 2.5);
  } else {
    planetInfoEl.style.display = 'none';
    requestFocus(20);
  }
}

/* ---------- mode switching ---------- */
let currentMode = 'galaxy';
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const colorPanelEl = document.getElementById('colorPanel');

function setMode(mode) {
  currentMode = mode;
  galaxyPoints.visible = galaxyBokehPoints.visible = mode === 'galaxy';
  blackholeGroup.visible = mode === 'blackhole';
  planetsGroup.visible = mode === 'planets';

  shapeLabel.style.display = colorPanelEl.style.display = mode === 'galaxy' ? 'block' : 'none';
  planetMenuEl.style.display = mode === 'planets' ? 'block' : 'none';
  planetInfoEl.style.display = mode === 'planets' && selectedPlanet ? 'block' : 'none';

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  if (mode === 'galaxy') {
    overlayTitle.textContent = 'Space Explorer';
    overlaySub.textContent = 'Drag to rotate · Scroll to zoom';
    requestFocus(9);
  } else if (mode === 'blackhole') {
    overlayTitle.textContent = 'Black Hole';
    overlaySub.textContent = 'A star\u2019s light bends around the event horizon';
    requestFocus(7);
  } else {
    overlayTitle.textContent = 'Solar System';
    overlaySub.textContent = 'Tap a planet to explore';
    requestFocus(20);
  }
}
document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
blackholeGroup.visible = false;
planetsGroup.visible = false;
scene.add(blackholeGroup, planetsGroup);

/* ---------- camera focus ---------- */
let focusTimer = 0, focusDistance = 9;
const requestFocus = (d, dur = 1.4) => { focusDistance = d; focusTimer = dur; };
const _origin = new THREE.Vector3();
const desiredTarget = () => (currentMode === 'planets' && selectedPlanet ? selectedPlanet.mesh.position : _origin);

/* ---------- color panel ---------- */
const cpCore = document.getElementById('cpCore'), cpMid = document.getElementById('cpMid'), cpEdge = document.getElementById('cpEdge');
const HEX = /^#[0-9a-fA-F]{6}$/;
function applyColors(c, m, e) {
  if (!HEX.test(c) || !HEX.test(m) || !HEX.test(e)) return;
  colorCore.set(c); colorMid.set(m); colorEdge.set(e);
  regenerateGalaxyColors();
}
[cpCore, cpMid, cpEdge].forEach(el => el.addEventListener('input', () => applyColors(cpCore.value, cpMid.value, cpEdge.value)));
document.querySelectorAll('.cp-swatch').forEach(btn => btn.addEventListener('click', () => {
  const { core, mid, edge } = btn.dataset;
  cpCore.value = core; cpMid.value = mid; cpEdge.value = edge;
  applyColors(core, mid, edge);
}));

/* ---------- animation loop ---------- */
const clock = new THREE.Clock();
const _prev = new THREE.Vector3(), _delta = new THREE.Vector3(), _off = new THREE.Vector3();
let rafId = 0;

function animate() {
  rafId = requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (currentMode === 'galaxy') updateGalaxy(dt);
  else if (currentMode === 'blackhole') updateBlackhole(dt);
  else updatePlanets(dt);

  _prev.copy(controls.target);
  controls.target.lerp(desiredTarget(), currentMode === 'planets' && selectedPlanet ? 0.05 : 0.06);
  camera.position.add(_delta.copy(controls.target).sub(_prev));

  if (focusTimer > 0) {
    focusTimer -= dt;
    _off.copy(camera.position).sub(controls.target);
    const nd = THREE.MathUtils.lerp(_off.length(), focusDistance, 0.06);
    camera.position.copy(controls.target).add(_off.setLength(Math.max(nd, 0.01)));
  }

  controls.update();
  composer.render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); cancelAnimationFrame(rafId); animate(); }
});

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  }, 80);
});

/* ---------- boot ---------- */
(function boot() {
  const n = _d(_cfg.a), u = _d(_cfg.b);
  renderer.domElement.setAttribute('aria-label', 'Space Explorer by ' + n);
  const a = document.createElement('a');
  a.id = 'credit';
  a.href = u;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = '\u00A9 ' + n;
  document.body.appendChild(a);
  try {
    console.log('%c\u2726 ' + n + ' %c ' + u,
      'background:#0b1220;color:#6ee7ff;padding:6px 10px;border-radius:6px 0 0 6px;font:600 13px system-ui',
      'background:#6ee7ff;color:#001018;padding:6px 10px;border-radius:0 6px 6px 0;font:600 13px system-ui');
    console.log(u);
  } catch (e) {}
  document.getElementById('loading').style.display = 'none';
  shapeLabel.textContent = GALAXY_SHAPES[0].name;
  setMode('galaxy');
  animate();
})();
</script>
